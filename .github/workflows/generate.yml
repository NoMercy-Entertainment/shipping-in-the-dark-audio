name: Generate Audio Narration

on:
  push:
    branches: [master]
    paths:
      - 'speeches/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/generate.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to generate: "all", "entries", "team", or a specific slug'
        required: false
        type: string
        default: 'all'
      dry_run:
        description: 'Dry run — skip generation'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Only one audio generation may be in flight at a time. A rapid
# sequence of pushes cancels the older run, so only the latest
# commit's audio lands on the release + journal site. Without this,
# two concurrent collect steps race on git push — the older run can
# land AFTER the newer run and leave stale audio on the page.
concurrency:
  group: generate-audio
  cancel-in-progress: true

jobs:
  list-scripts:
    runs-on: [self-hosted, beast-unit]
    outputs:
      entry_scripts: ${{ steps.list.outputs.entry_scripts }}
      team_scripts: ${{ steps.list.outputs.team_scripts }}
      report_scripts: ${{ steps.list.outputs.report_scripts }}
      has_entries: ${{ steps.list.outputs.has_entries }}
      has_team: ${{ steps.list.outputs.has_team }}
      has_reports: ${{ steps.list.outputs.has_reports }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List speech scripts to generate
        id: list
        run: |
          TARGET="${{ inputs.target || '' }}"
          ALL_ENTRIES=$(ls speeches/entries/*.speech.md 2>/dev/null | xargs -I{} basename {} .speech.md | jq -R . | jq -sc .)
          ALL_TEAM=$(ls speeches/team/*.speech.md 2>/dev/null | xargs -I{} basename {} .speech.md | jq -R . | jq -sc .)
          # Reports: each matrix entry is "report-slug/script-slug" (e.g. "the-effortless-encoder/00-overview")
          ALL_REPORTS=$(find speeches/reports -name '*.speech.md' 2>/dev/null \
            | sed 's|^speeches/reports/||; s|\.speech\.md$||' | jq -R . | jq -sc .)

          if [ -n "$TARGET" ]; then
            # workflow_dispatch: respect the target input
            case "$TARGET" in
              all)
                entries="$ALL_ENTRIES"
                team="$ALL_TEAM"
                reports="$ALL_REPORTS"
                ;;
              entries)
                entries="$ALL_ENTRIES"
                team="[]"
                reports="[]"
                ;;
              team)
                entries="[]"
                team="$ALL_TEAM"
                reports="[]"
                ;;
              reports)
                entries="[]"
                team="[]"
                reports="$ALL_REPORTS"
                ;;
              *)
                if [ -f "speeches/entries/$TARGET.speech.md" ]; then
                  entries="[\"$TARGET\"]"
                  team="[]"
                  reports="[]"
                elif [ -f "speeches/team/$TARGET.speech.md" ]; then
                  entries="[]"
                  team="[\"$TARGET\"]"
                  reports="[]"
                elif [ -f "speeches/reports/$TARGET.speech.md" ]; then
                  entries="[]"
                  team="[]"
                  reports="[\"$TARGET\"]"
                else
                  echo "::error::Unknown target: $TARGET"
                  exit 1
                fi
                ;;
            esac
            echo "Mode: workflow_dispatch, target=$TARGET"
          else
            # Push event: only regenerate what changed
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files:"
            echo "$CHANGED"

            # Config, scripts, or the workflow file itself changed → regenerate
            # everything. The push trigger above watches all three paths, so
            # this check has to match it exactly or a workflow-only change
            # (like this one) matches the trigger but produces an empty
            # entries/team/reports list and every generation job skips.
            if echo "$CHANGED" | grep -qE "^(config/|scripts/|\.github/workflows/generate\.yml$)"; then
              echo "Config or synth script changed — regenerating all"
              entries="$ALL_ENTRIES"
              team="$ALL_TEAM"
              reports="$ALL_REPORTS"
            else
              entries="[]"
              team="[]"
              reports="[]"

              changed_entries=$(echo "$CHANGED" | grep "^speeches/entries/.*\.speech\.md$" | sed 's|speeches/entries/||; s|\.speech\.md||' | jq -R . | jq -sc .)
              changed_team=$(echo "$CHANGED" | grep "^speeches/team/.*\.speech\.md$" | sed 's|speeches/team/||; s|\.speech\.md||' | jq -R . | jq -sc .)
              changed_reports=$(echo "$CHANGED" | grep "^speeches/reports/.*\.speech\.md$" | sed 's|speeches/reports/||; s|\.speech\.md||' | jq -R . | jq -sc .)

              [ -n "$changed_entries" ] && [ "$changed_entries" != "[]" ] && [ "$changed_entries" != "null" ] && entries="$changed_entries"
              [ -n "$changed_team" ] && [ "$changed_team" != "[]" ] && [ "$changed_team" != "null" ] && team="$changed_team"
              [ -n "$changed_reports" ] && [ "$changed_reports" != "[]" ] && [ "$changed_reports" != "null" ] && reports="$changed_reports"
            fi
            echo "Mode: push, detected changes"
          fi

          # Export
          echo "entry_scripts=${entries}" >> $GITHUB_OUTPUT
          echo "team_scripts=${team}" >> $GITHUB_OUTPUT
          echo "report_scripts=${reports}" >> $GITHUB_OUTPUT
          echo "has_entries=$( [ "$entries" != '[]' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "has_team=$( [ "$team" != '[]' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "has_reports=$( [ "$reports" != '[]' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "Entries: $entries"
          echo "Team: $team"
          echo "Reports: $reports"

  generate-entries:
    if: ${{ inputs.dry_run != true && needs.list-scripts.outputs.has_entries == 'true' }}
    runs-on: [self-hosted, beast-unit]
    needs: list-scripts
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        script: ${{ fromJson(needs.list-scripts.outputs.entry_scripts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python + ffmpeg
        run: |
          umask 0022
          python3 -m venv .venv
          .venv/bin/pip install -q edge-tts
          which ffmpeg || sudo apt-get install -y -qq ffmpeg

      - name: Synthesize
        run: |
          source .venv/bin/activate
          mkdir -p output
          python scripts/synth-edge.py "speeches/entries/${{ matrix.script }}.speech.md" "output/${{ matrix.script }}.mp3"

      - name: Validate output
        run: |
          mp3="output/${{ matrix.script }}.mp3"
          vtt="output/${{ matrix.script }}.vtt"
          [ -f "$mp3" ] && [ -s "$mp3" ] || { echo "::error::MP3 missing or empty: $mp3"; exit 1; }
          [ -f "$vtt" ] && [ -s "$vtt" ] || { echo "::error::VTT missing or empty: $vtt"; exit 1; }
          echo "MP3: $(du -h "$mp3" | cut -f1), VTT: $(wc -l < "$vtt") lines"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.script }}
          path: |
            output/${{ matrix.script }}.mp3
            output/${{ matrix.script }}.vtt
          if-no-files-found: error

  generate-team:
    if: ${{ inputs.dry_run != true && needs.list-scripts.outputs.has_team == 'true' }}
    runs-on: [self-hosted, beast-unit]
    needs: list-scripts
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        script: ${{ fromJson(needs.list-scripts.outputs.team_scripts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python + ffmpeg
        run: |
          umask 0022
          python3 -m venv .venv
          .venv/bin/pip install -q edge-tts
          which ffmpeg || sudo apt-get install -y -qq ffmpeg

      - name: Synthesize
        run: |
          source .venv/bin/activate
          mkdir -p output/team
          python scripts/synth-edge.py "speeches/team/${{ matrix.script }}.speech.md" "output/team/${{ matrix.script }}.mp3"

      - name: Validate output
        run: |
          mp3="output/team/${{ matrix.script }}.mp3"
          vtt="output/team/${{ matrix.script }}.vtt"
          [ -f "$mp3" ] && [ -s "$mp3" ] || { echo "::error::MP3 missing or empty: $mp3"; exit 1; }
          [ -f "$vtt" ] && [ -s "$vtt" ] || { echo "::error::VTT missing or empty: $vtt"; exit 1; }
          echo "MP3: $(du -h "$mp3" | cut -f1), VTT: $(wc -l < "$vtt") lines"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: team-${{ matrix.script }}
          path: |
            output/team/${{ matrix.script }}.mp3
            output/team/${{ matrix.script }}.vtt
          if-no-files-found: error

  generate-reports:
    if: ${{ inputs.dry_run != true && needs.list-scripts.outputs.has_reports == 'true' }}
    runs-on: [self-hosted, beast-unit]
    needs: list-scripts
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        script: ${{ fromJson(needs.list-scripts.outputs.report_scripts) }}
        voice: [female, male]
        variant: [brief, elaborate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python + ffmpeg
        run: |
          umask 0022
          python3 -m venv .venv
          .venv/bin/pip install -q edge-tts
          which ffmpeg || sudo apt-get install -y -qq ffmpeg

      - name: Compute paths
        id: paths
        run: |
          REPORT_DIR="$(dirname '${{ matrix.script }}')"
          SCRIPT_SLUG="$(basename '${{ matrix.script }}')"
          REPORT_PREFIX="$(echo "$REPORT_DIR" | tr '/' '-')"
          OUT_DIR="output/reports/${REPORT_DIR}"
          OUT_BASE="${SCRIPT_SLUG}.${{ matrix.voice }}.${{ matrix.variant }}"
          mkdir -p "$OUT_DIR"
          echo "report_dir=$REPORT_DIR"     >> $GITHUB_OUTPUT
          echo "script_slug=$SCRIPT_SLUG"   >> $GITHUB_OUTPUT
          echo "report_prefix=$REPORT_PREFIX" >> $GITHUB_OUTPUT
          echo "out_dir=$OUT_DIR"           >> $GITHUB_OUTPUT
          echo "out_base=$OUT_BASE"         >> $GITHUB_OUTPUT
          echo "source_script=speeches/reports/${{ matrix.script }}.speech.md" >> $GITHUB_OUTPUT

      - name: Resolve narrator voice id
        id: narrator
        run: |
          if [ "${{ matrix.voice }}" = "male" ]; then
            echo "id=narrator_male" >> $GITHUB_OUTPUT
          else
            echo "id=narrator" >> $GITHUB_OUTPUT
          fi

      - name: Synthesize
        env:
          NARRATOR_VOICE_ID: ${{ steps.narrator.outputs.id }}
          SPEECH_VARIANT: ${{ matrix.variant }}
        run: |
          source .venv/bin/activate
          python scripts/synth-edge.py \
            "${{ steps.paths.outputs.source_script }}" \
            "${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.mp3"

      - name: Validate output
        run: |
          mp3="${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.mp3"
          vtt="${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.vtt"
          [ -f "$mp3" ] && [ -s "$mp3" ] || { echo "::error::MP3 missing or empty: $mp3"; exit 1; }
          [ -f "$vtt" ] && [ -s "$vtt" ] || { echo "::error::VTT missing or empty: $vtt"; exit 1; }
          echo "MP3: $(du -h "$mp3" | cut -f1), VTT: $(wc -l < "$vtt") lines"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.paths.outputs.report_prefix }}-${{ steps.paths.outputs.script_slug }}-${{ matrix.voice }}-${{ matrix.variant }}
          path: |
            ${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.mp3
            ${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.vtt
          if-no-files-found: error

  collect:
    needs: [list-scripts, generate-entries, generate-team, generate-reports]
    if: >-
      always() &&
      (needs.generate-entries.result == 'success' ||
       needs.generate-team.result == 'success' ||
       needs.generate-reports.result == 'success')
    runs-on: [self-hosted, beast-unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect outputs
        run: |
          mkdir -p output output/team output/reports

          for dir in artifacts/entry-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.mp3 "$dir"/*.vtt output/ 2>/dev/null || true
          done
          for dir in artifacts/team-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.mp3 "$dir"/*.vtt output/team/ 2>/dev/null || true
          done
          # Reports: the upload-artifact action flattens the common root, so
          # each artifact directory contains bare
          # {script}.{voice}.{variant}.mp3 / .vtt. Reconstruct the report
          # subdir from the artifact name, which has the pattern
          # report-{report_prefix}-{script_slug}-{voice}-{variant}.
          # report_prefix is the report folder name (e.g. "the-effortless-encoder").
          for dir in artifacts/report-*; do
            [ -d "$dir" ] || continue
            artname="$(basename "$dir")"
            tmp="${artname#report-}"
            # Peel from the tail: variant, then voice.
            variant="${tmp##*-}"
            tmp="${tmp%-$variant}"
            voice="${tmp##*-}"
            tmp="${tmp%-$voice}"
            report_prefix=""
            script_slug=""
            # The MP3 filename = {script_slug}.{voice}.{variant}.mp3.
            # Use it as ground truth for splitting prefix vs script slug.
            mp3_name="$(ls "$dir"/*.mp3 2>/dev/null | head -1 | xargs -n1 basename)"
            if [ -n "$mp3_name" ]; then
              script_slug="${mp3_name%.${voice}.${variant}.mp3}"
              report_prefix="${tmp%-$script_slug}"
            fi
            if [ -z "$report_prefix" ] || [ -z "$script_slug" ]; then
              echo "::warning::Could not parse report artifact name: $artname"
              continue
            fi
            mkdir -p "output/reports/${report_prefix}"
            cp "$dir"/*.mp3 "$dir"/*.vtt "output/reports/${report_prefix}/" 2>/dev/null || true
          done

          entry_mp3=$(ls output/*.mp3 2>/dev/null | wc -l)
          entry_vtt=$(ls output/*.vtt 2>/dev/null | wc -l)
          team_mp3=$(ls output/team/*.mp3 2>/dev/null | wc -l)
          team_vtt=$(ls output/team/*.vtt 2>/dev/null | wc -l)
          report_mp3=$(find output/reports -name '*.mp3' 2>/dev/null | wc -l)
          report_vtt=$(find output/reports -name '*.vtt' 2>/dev/null | wc -l)
          echo "Entry:   ${entry_mp3} MP3s, ${entry_vtt} VTTs"
          echo "Team:    ${team_mp3} MP3s, ${team_vtt} VTTs"
          echo "Reports: ${report_mp3} MP3s, ${report_vtt} VTTs"

          total=$((entry_mp3 + team_mp3 + report_mp3))
          if [ "$total" -eq 0 ]; then
            echo "::error::No audio files collected — nothing to deploy"
            exit 1
          fi

      - name: Commit audio to audio repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git stash --include-untracked
          git pull --rebase origin master
          git stash pop || true
          git add output/
          if git diff --cached --quiet; then
            echo "No audio changes to commit"
            exit 0
          fi
          git commit -m "chore: update audio output"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — pulling with rebase"
            git pull --rebase --autostash origin master || true
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push audio output after 5 attempts"
          exit 1

      - name: Upload MP3s to GitHub Release
        run: |
          # Entry and team MP3s upload with their basename
          for mp3 in output/*.mp3 output/team/*.mp3; do
            [ -f "$mp3" ] || continue
            echo "Uploading: $mp3"
            gh release upload audio-v1 "$mp3" --repo NoMercy-Entertainment/shipping-in-the-dark --clobber || true
          done
          # Report MP3s: live under output/reports/{report_dir}/{script}.{voice}.mp3.
          # Copy into a flat staging dir with {report_dir}--{script}.{voice}.mp3
          # names so GitHub's release asset is unique and collision-free.
          # `gh release upload FILE#LABEL` only affects the label, not the
          # uploaded filename — so we rename the actual files.
          mkdir -p /tmp/report-upload
          while IFS= read -r mp3; do
            [ -f "$mp3" ] || continue
            rel="${mp3#output/reports/}"
            report_dir="${rel%%/*}"
            leaf="${rel#*/}"
            upload_name="${report_dir}--${leaf}"
            cp "$mp3" "/tmp/report-upload/${upload_name}"
            echo "Uploading: $mp3 → $upload_name"
            gh release upload audio-v1 "/tmp/report-upload/${upload_name}" --repo NoMercy-Entertainment/shipping-in-the-dark --clobber
          done < <(find output/reports -name '*.mp3' 2>/dev/null)
          rm -rf /tmp/report-upload

          # Clean up the short-named report MP3s that an earlier buggy
          # workflow accidentally uploaded (00-overview.female.mp3, etc.).
          while IFS= read -r mp3; do
            [ -f "$mp3" ] || continue
            rel="${mp3#output/reports/}"
            leaf="${rel#*/}"
            short_name="$leaf"   # e.g. 00-overview.female.mp3
            # Only delete if it matches our report script naming pattern
            # AND a full-name variant exists on the release.
            report_dir="${rel%%/*}"
            full_name="${report_dir}--${leaf}"
            if gh release view audio-v1 --repo NoMercy-Entertainment/shipping-in-the-dark --json assets --jq ".assets[].name" | grep -Fx "$full_name" >/dev/null 2>&1; then
              gh release delete-asset audio-v1 "$short_name" --repo NoMercy-Entertainment/shipping-in-the-dark --yes 2>/dev/null || true
            fi
          done < <(find output/reports -name '*.mp3' 2>/dev/null)
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Deploy VTTs to journal site
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/NoMercy-Entertainment/shipping-in-the-dark.git journal-site
          mkdir -p journal-site/site/public/audio/team journal-site/site/public/audio/reports

          for vtt in output/*.vtt; do
            [ -f "$vtt" ] && cp "$vtt" journal-site/site/public/audio/
          done
          for vtt in output/team/*.vtt; do
            [ -f "$vtt" ] && cp "$vtt" journal-site/site/public/audio/team/
          done
          # Preserve the reports/{report_dir}/ structure under /audio/reports/
          if [ -d output/reports ]; then
            cp -r output/reports/* journal-site/site/public/audio/reports/ 2>/dev/null || true
          fi

          # audio-manifest.json records, per mp3 (path relative to
          # public/audio), the epoch-ms time this run actually wrote it.
          # check-vtt-integrity.mjs uses it to catch the one failure a
          # file-level inspection cannot see: a VTT retimed (e.g. a new
          # title cue sliding every later cue) without the audio underneath
          # it ever being re-synthesized. Merge into the existing manifest
          # rather than replace it, since a partial run only touches some
          # of the catalog.
          MANIFEST_TMP=$(mktemp)
          echo '{}' > "$MANIFEST_TMP"
          add_manifest_entries() {
            local base_dir="$1" rel_prefix="$2"
            [ -d "$base_dir" ] || return 0
            for mp3 in "$base_dir"/*.mp3; do
              [ -f "$mp3" ] || continue
              local name mtime_ms
              name=$(basename "$mp3")
              mtime_ms=$(( $(stat -c %Y "$mp3") * 1000 ))
              jq --arg k "${rel_prefix}${name}" --argjson v "$mtime_ms" '.[$k] = $v' "$MANIFEST_TMP" > "$MANIFEST_TMP.new"
              mv "$MANIFEST_TMP.new" "$MANIFEST_TMP"
            done
          }
          add_manifest_entries "output" ""
          add_manifest_entries "output/team" "team/"
          if [ -d output/reports ]; then
            for d in output/reports/*/; do
              rd="$(basename "$d")"
              add_manifest_entries "output/reports/$rd" "reports/$rd/"
            done
          fi

          MANIFEST_DEST="journal-site/site/public/audio/audio-manifest.json"
          if [ -f "$MANIFEST_DEST" ]; then
            jq -s '.[0] * .[1]' "$MANIFEST_DEST" "$MANIFEST_TMP" > "$MANIFEST_DEST.new"
            mv "$MANIFEST_DEST.new" "$MANIFEST_DEST"
          else
            cp "$MANIFEST_TMP" "$MANIFEST_DEST"
          fi

          cd journal-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/audio/
          if git diff --cached --quiet; then
            echo "No VTT changes to deploy"
            exit 0
          fi
          git commit -m "chore: update audio VTTs from CI generation"

          # Push with retry-on-conflict. Concurrency:cancel-in-progress on
          # this workflow prevents simultaneous runs, but a push to the
          # journal site by an unrelated workflow (deploy, docs) between
          # our clone and push can still non-fast-forward. Rebase and
          # retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — pulling with rebase"
            git pull --rebase --autostash origin master || true
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push VTTs to journal site after 5 attempts"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.PAT }}
