name: Generate Audio Narration

on:
  push:
    branches: [master]
    paths:
      - 'speeches/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/generate.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to generate: "all", "entries", "team", or a specific slug'
        required: false
        type: string
        default: 'all'
      dry_run:
        description: 'Dry run — skip generation'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  list-scripts:
    runs-on: [self-hosted, beast-unit]
    outputs:
      entry_scripts: ${{ steps.list.outputs.entry_scripts }}
      team_scripts: ${{ steps.list.outputs.team_scripts }}
      report_scripts: ${{ steps.list.outputs.report_scripts }}
      has_entries: ${{ steps.list.outputs.has_entries }}
      has_team: ${{ steps.list.outputs.has_team }}
      has_reports: ${{ steps.list.outputs.has_reports }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List speech scripts to generate
        id: list
        run: |
          TARGET="${{ inputs.target || '' }}"
          ALL_ENTRIES=$(ls speeches/*.speech.md 2>/dev/null | xargs -I{} basename {} .speech.md | jq -R . | jq -sc .)
          ALL_TEAM=$(ls speeches/team/*.speech.md 2>/dev/null | xargs -I{} basename {} .speech.md | jq -R . | jq -sc .)
          # Reports: each matrix entry is "report-slug/script-slug" (e.g. "the-effortless-encoder/00-overview")
          ALL_REPORTS=$(find speeches/reports -name '*.speech.md' 2>/dev/null \
            | sed 's|^speeches/reports/||; s|\.speech\.md$||' | jq -R . | jq -sc .)

          if [ -n "$TARGET" ]; then
            # workflow_dispatch: respect the target input
            case "$TARGET" in
              all)
                entries="$ALL_ENTRIES"
                team="$ALL_TEAM"
                reports="$ALL_REPORTS"
                ;;
              entries)
                entries="$ALL_ENTRIES"
                team="[]"
                reports="[]"
                ;;
              team)
                entries="[]"
                team="$ALL_TEAM"
                reports="[]"
                ;;
              reports)
                entries="[]"
                team="[]"
                reports="$ALL_REPORTS"
                ;;
              *)
                if [ -f "speeches/$TARGET.speech.md" ]; then
                  entries="[\"$TARGET\"]"
                  team="[]"
                  reports="[]"
                elif [ -f "speeches/team/$TARGET.speech.md" ]; then
                  entries="[]"
                  team="[\"$TARGET\"]"
                  reports="[]"
                elif [ -f "speeches/reports/$TARGET.speech.md" ]; then
                  entries="[]"
                  team="[]"
                  reports="[\"$TARGET\"]"
                else
                  echo "::error::Unknown target: $TARGET"
                  exit 1
                fi
                ;;
            esac
            echo "Mode: workflow_dispatch, target=$TARGET"
          else
            # Push event: only regenerate what changed
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files:"
            echo "$CHANGED"

            # Config or scripts dir changed → regenerate everything
            if echo "$CHANGED" | grep -qE "^(config/|scripts/)"; then
              echo "Config or synth script changed — regenerating all"
              entries="$ALL_ENTRIES"
              team="$ALL_TEAM"
              reports="$ALL_REPORTS"
            else
              entries="[]"
              team="[]"
              reports="[]"

              changed_entries=$(echo "$CHANGED" | grep "^speeches/[^/]*\.speech\.md$" | sed 's|speeches/||; s|\.speech\.md||' | jq -R . | jq -sc .)
              changed_team=$(echo "$CHANGED" | grep "^speeches/team/.*\.speech\.md$" | sed 's|speeches/team/||; s|\.speech\.md||' | jq -R . | jq -sc .)
              changed_reports=$(echo "$CHANGED" | grep "^speeches/reports/.*\.speech\.md$" | sed 's|speeches/reports/||; s|\.speech\.md||' | jq -R . | jq -sc .)

              [ -n "$changed_entries" ] && [ "$changed_entries" != "[]" ] && [ "$changed_entries" != "null" ] && entries="$changed_entries"
              [ -n "$changed_team" ] && [ "$changed_team" != "[]" ] && [ "$changed_team" != "null" ] && team="$changed_team"
              [ -n "$changed_reports" ] && [ "$changed_reports" != "[]" ] && [ "$changed_reports" != "null" ] && reports="$changed_reports"
            fi
            echo "Mode: push, detected changes"
          fi

          # Export
          echo "entry_scripts=${entries}" >> $GITHUB_OUTPUT
          echo "team_scripts=${team}" >> $GITHUB_OUTPUT
          echo "report_scripts=${reports}" >> $GITHUB_OUTPUT
          echo "has_entries=$( [ "$entries" != '[]' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "has_team=$( [ "$team" != '[]' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "has_reports=$( [ "$reports" != '[]' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "Entries: $entries"
          echo "Team: $team"
          echo "Reports: $reports"

  generate-entries:
    if: ${{ inputs.dry_run != true && needs.list-scripts.outputs.has_entries == 'true' }}
    runs-on: [self-hosted, beast-unit]
    needs: list-scripts
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        script: ${{ fromJson(needs.list-scripts.outputs.entry_scripts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python + ffmpeg
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q edge-tts
          which ffmpeg || sudo apt-get install -y -qq ffmpeg

      - name: Synthesize
        run: |
          source .venv/bin/activate
          mkdir -p output
          python scripts/synth-edge.py "speeches/${{ matrix.script }}.speech.md" "output/${{ matrix.script }}.mp3"

      - name: Validate output
        run: |
          mp3="output/${{ matrix.script }}.mp3"
          vtt="output/${{ matrix.script }}.vtt"
          [ -f "$mp3" ] && [ -s "$mp3" ] || { echo "::error::MP3 missing or empty: $mp3"; exit 1; }
          [ -f "$vtt" ] && [ -s "$vtt" ] || { echo "::error::VTT missing or empty: $vtt"; exit 1; }
          echo "MP3: $(du -h "$mp3" | cut -f1), VTT: $(wc -l < "$vtt") lines"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.script }}
          path: |
            output/${{ matrix.script }}.mp3
            output/${{ matrix.script }}.vtt
          if-no-files-found: error

  generate-team:
    if: ${{ inputs.dry_run != true && needs.list-scripts.outputs.has_team == 'true' }}
    runs-on: [self-hosted, beast-unit]
    needs: list-scripts
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        script: ${{ fromJson(needs.list-scripts.outputs.team_scripts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python + ffmpeg
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q edge-tts
          which ffmpeg || sudo apt-get install -y -qq ffmpeg

      - name: Synthesize
        run: |
          source .venv/bin/activate
          mkdir -p output/team
          python scripts/synth-edge.py "speeches/team/${{ matrix.script }}.speech.md" "output/team/${{ matrix.script }}.mp3"

      - name: Validate output
        run: |
          mp3="output/team/${{ matrix.script }}.mp3"
          vtt="output/team/${{ matrix.script }}.vtt"
          [ -f "$mp3" ] && [ -s "$mp3" ] || { echo "::error::MP3 missing or empty: $mp3"; exit 1; }
          [ -f "$vtt" ] && [ -s "$vtt" ] || { echo "::error::VTT missing or empty: $vtt"; exit 1; }
          echo "MP3: $(du -h "$mp3" | cut -f1), VTT: $(wc -l < "$vtt") lines"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: team-${{ matrix.script }}
          path: |
            output/team/${{ matrix.script }}.mp3
            output/team/${{ matrix.script }}.vtt
          if-no-files-found: error

  generate-reports:
    if: ${{ inputs.dry_run != true && needs.list-scripts.outputs.has_reports == 'true' }}
    runs-on: [self-hosted, beast-unit]
    needs: list-scripts
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        script: ${{ fromJson(needs.list-scripts.outputs.report_scripts) }}
        voice: [female, male]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python + ffmpeg
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q edge-tts
          which ffmpeg || sudo apt-get install -y -qq ffmpeg

      - name: Compute paths
        id: paths
        run: |
          REPORT_DIR="$(dirname '${{ matrix.script }}')"
          SCRIPT_SLUG="$(basename '${{ matrix.script }}')"
          REPORT_PREFIX="$(echo "$REPORT_DIR" | tr '/' '-')"
          OUT_DIR="output/reports/${REPORT_DIR}"
          OUT_BASE="${SCRIPT_SLUG}.${{ matrix.voice }}"
          mkdir -p "$OUT_DIR"
          echo "report_dir=$REPORT_DIR"     >> $GITHUB_OUTPUT
          echo "script_slug=$SCRIPT_SLUG"   >> $GITHUB_OUTPUT
          echo "report_prefix=$REPORT_PREFIX" >> $GITHUB_OUTPUT
          echo "out_dir=$OUT_DIR"           >> $GITHUB_OUTPUT
          echo "out_base=$OUT_BASE"         >> $GITHUB_OUTPUT
          echo "source_script=speeches/reports/${{ matrix.script }}.speech.md" >> $GITHUB_OUTPUT

      - name: Resolve narrator voice id
        id: narrator
        run: |
          if [ "${{ matrix.voice }}" = "male" ]; then
            echo "id=narrator_male" >> $GITHUB_OUTPUT
          else
            echo "id=narrator" >> $GITHUB_OUTPUT
          fi

      - name: Synthesize
        env:
          NARRATOR_VOICE_ID: ${{ steps.narrator.outputs.id }}
        run: |
          source .venv/bin/activate
          python scripts/synth-edge.py \
            "${{ steps.paths.outputs.source_script }}" \
            "${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.mp3"

      - name: Validate output
        run: |
          mp3="${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.mp3"
          vtt="${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.vtt"
          [ -f "$mp3" ] && [ -s "$mp3" ] || { echo "::error::MP3 missing or empty: $mp3"; exit 1; }
          [ -f "$vtt" ] && [ -s "$vtt" ] || { echo "::error::VTT missing or empty: $vtt"; exit 1; }
          echo "MP3: $(du -h "$mp3" | cut -f1), VTT: $(wc -l < "$vtt") lines"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.paths.outputs.report_prefix }}-${{ steps.paths.outputs.script_slug }}-${{ matrix.voice }}
          path: |
            ${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.mp3
            ${{ steps.paths.outputs.out_dir }}/${{ steps.paths.outputs.out_base }}.vtt
          if-no-files-found: error

  collect:
    needs: [list-scripts, generate-entries, generate-team, generate-reports]
    if: >-
      always() &&
      (needs.generate-entries.result == 'success' ||
       needs.generate-team.result == 'success' ||
       needs.generate-reports.result == 'success')
    runs-on: [self-hosted, beast-unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect outputs
        run: |
          mkdir -p output output/team

          for dir in artifacts/entry-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.mp3 "$dir"/*.vtt output/ 2>/dev/null || true
          done
          for dir in artifacts/team-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.mp3 "$dir"/*.vtt output/team/ 2>/dev/null || true
          done

          entry_mp3=$(ls output/*.mp3 2>/dev/null | wc -l)
          entry_vtt=$(ls output/*.vtt 2>/dev/null | wc -l)
          team_mp3=$(ls output/team/*.mp3 2>/dev/null | wc -l)
          team_vtt=$(ls output/team/*.vtt 2>/dev/null | wc -l)
          echo "Entry: ${entry_mp3} MP3s, ${entry_vtt} VTTs"
          echo "Team:  ${team_mp3} MP3s, ${team_vtt} VTTs"

          total=$((entry_mp3 + team_mp3))
          if [ "$total" -eq 0 ]; then
            echo "::error::No audio files collected — nothing to deploy"
            exit 1
          fi

      - name: Commit audio to audio repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git stash --include-untracked
          git pull --rebase origin master
          git stash pop || true
          git add output/
          git diff --cached --quiet || {
            git commit -m "chore: update audio output"
            git push
          }

      - name: Upload MP3s to GitHub Release
        run: |
          for mp3 in output/*.mp3 output/team/*.mp3; do
            [ -f "$mp3" ] || continue
            echo "Uploading: $mp3"
            gh release upload audio-v1 "$mp3" --repo NoMercy-Entertainment/shipping-in-the-dark --clobber || true
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Deploy VTTs to journal site
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/NoMercy-Entertainment/shipping-in-the-dark.git journal-site
          mkdir -p journal-site/site/public/audio/team

          for vtt in output/*.vtt; do
            [ -f "$vtt" ] && cp "$vtt" journal-site/site/public/audio/
          done
          for vtt in output/team/*.vtt; do
            [ -f "$vtt" ] && cp "$vtt" journal-site/site/public/audio/team/
          done

          cd journal-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/audio/
          git diff --cached --quiet || {
            git commit -m "chore: update audio VTTs from CI generation"
            git push
          }
        env:
          GH_TOKEN: ${{ secrets.PAT }}
