name: Generate Audio Narration

on:
  push:
    branches: [master]
    paths:
      - 'speeches/**'
      - 'config/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to generate: "all", "entries", "team", or a specific slug'
        required: false
        type: string
        default: 'all'
      dry_run:
        description: 'Dry run — skip generation'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  list-scripts:
    runs-on: [self-hosted, beast-unit]
    outputs:
      entry_scripts: ${{ steps.list.outputs.entry_scripts }}
      team_scripts: ${{ steps.list.outputs.team_scripts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List speech scripts
        id: list
        run: |
          entries=$(ls speeches/*.speech.md 2>/dev/null | xargs -I{} basename {} .speech.md | jq -R . | jq -sc .)
          team=$(ls speeches/team/*.speech.md 2>/dev/null | xargs -I{} basename {} .speech.md | jq -R . | jq -sc .)
          echo "entry_scripts=${entries}" >> $GITHUB_OUTPUT
          echo "team_scripts=${team}" >> $GITHUB_OUTPUT
          echo "Entries: $entries"
          echo "Team: $team"

  generate-entries:
    if: ${{ inputs.dry_run != true }}
    runs-on: [self-hosted, beast-unit]
    needs: list-scripts
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJson(needs.list-scripts.outputs.entry_scripts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q edge-tts

      - name: Install ffmpeg
        run: which ffmpeg || sudo apt-get install -y -qq ffmpeg

      - name: Synthesize
        run: |
          source .venv/bin/activate
          mkdir -p output
          echo "Synthesizing entry: ${{ matrix.script }}"
          python scripts/synth-edge.py "speeches/${{ matrix.script }}.speech.md" "output/${{ matrix.script }}.mp3"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.script }}
          path: |
            output/*.mp3
            output/*.vtt

  generate-team:
    if: ${{ inputs.dry_run != true }}
    runs-on: [self-hosted, beast-unit]
    needs: list-scripts
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJson(needs.list-scripts.outputs.team_scripts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q edge-tts

      - name: Install ffmpeg
        run: which ffmpeg || sudo apt-get install -y -qq ffmpeg

      - name: Synthesize
        run: |
          source .venv/bin/activate
          mkdir -p output/team
          echo "Synthesizing team: ${{ matrix.script }}"
          python scripts/synth-edge.py "speeches/team/${{ matrix.script }}.speech.md" "output/team/${{ matrix.script }}.mp3"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: team-${{ matrix.script }}
          path: |
            output/team/*.mp3
            output/team/*.vtt

  collect:
    needs: [generate-entries, generate-team]
    if: always() && (needs.generate-entries.result == 'success' || needs.generate-team.result == 'success')
    runs-on: [self-hosted, beast-unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect outputs
        run: |
          mkdir -p output output/team
          for dir in artifacts/entry-*; do
            [ -d "$dir" ] && cp "$dir"/output/*.mp3 "$dir"/output/*.vtt output/ 2>/dev/null || true
          done
          for dir in artifacts/team-*; do
            [ -d "$dir" ] && cp "$dir"/output/team/*.mp3 "$dir"/output/team/*.vtt output/team/ 2>/dev/null || true
          done
          echo "Entry MP3s: $(ls output/*.mp3 2>/dev/null | wc -l)"
          echo "Team MP3s: $(ls output/team/*.mp3 2>/dev/null | wc -l)"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: update audio output"
          git push
